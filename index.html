<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аук колесо</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.container{max-width:1400px;width:100%;background:rgba(255,255,255,.95);border-radius:30px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.3)}h1{text-align:center;color:#1e3c72;font-size:2.5em;margin-bottom:10px}.subtitle{text-align:center;color:#666;margin-bottom:30px;font-size:1.1em}.main-panel{display:flex;gap:30px;flex-wrap:wrap}.left-panel{flex:1;min-width:350px;background:#f8faff;border-radius:20px;padding:25px;box-shadow:0 5px 15px rgba(0,0,0,.1)}.add-section{margin-bottom:30px}.add-section h2{color:#1e3c72;margin-bottom:20px;font-size:1.5em}.input-group{display:flex;gap:10px;margin-bottom:15px}.input-group input,.input-group select{padding:15px;border:2px solid #e0e0e0;border-radius:12px;font-size:16px;transition:all 0.3s}.input-group input:focus,.input-group select:focus{border-color:#2a5298;outline:none;box-shadow:0 0 0 3px rgba(42,82,152,.1)}#itemName{flex:2}#itemWeight{flex:1}#addBtn{width:100%;padding:15px;background:#2a5298;color:white;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:10px}#addBtn:hover{background:#1e3c72;transform:translateY(-2px);box-shadow:0 5px 15px rgba(42,82,152,.3)}.items-list{background:white;border-radius:15px;padding:20px;margin-bottom:20px;max-height:400px;overflow-y:auto}.items-list h3{color:#1e3c72;margin-bottom:15px}.list-item{display:flex;align-items:center;padding:12px;border-bottom:1px solid #eee;transition:background 0.2s}.list-item:hover{background:#f8faff}.item-color{width:25px;height:25px;border-radius:8px;margin-right:12px;box-shadow:0 2px 5px rgba(0,0,0,.2)}.item-name{flex:2;font-weight:600;color:#333}.item-weight{background:#e3f2fd;padding:5px 12px;border-radius:20px;color:#1e3c72;font-weight:700;margin:0 10px}.item-percent{background:#e8f5e9;padding:5px 12px;border-radius:20px;color:#2e7d32;font-weight:700;min-width:70px;text-align:center}.remove-btn{background:none;border:none;color:#ff5252;font-size:24px;cursor:pointer;padding:0 10px;transition:all 0.2s}.remove-btn:hover{color:#ff1744;transform:scale(1.2)}.total-info{display:flex;justify-content:space-between;align-items:center;padding:15px;background:white;border-radius:12px;font-weight:700}.total-stats{display:flex;gap:20px;color:#1e3c72}.clear-btn{padding:10px 20px;background:#dc3545;color:white;border:none;border-radius:8px;cursor:pointer;transition:all 0.3s}.clear-btn:hover{background:#c82333;transform:translateY(-2px)}.right-panel{flex:1.2;min-width:450px;background:#f8faff;border-radius:20px;padding:25px;display:flex;flex-direction:column;align-items:center}.wheel-container{position:relative;width:450px;height:450px;margin:20px auto}canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 20px 40px rgba(0,0,0,.3);transition:transform cubic-bezier(.2,.8,.3,1)}.pointer{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:50px;color:#333;filter:drop-shadow(0 5px 3px rgba(0,0,0,.3));z-index:10;text-shadow:0 0 10px gold}.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:#333;border-radius:50%;border:5px solid white;box-shadow:0 2px 15px rgba(0,0,0,.3);z-index:15}.timer-control{width:100%;margin:15px 0;display:flex;align-items:center;justify-content:center;gap:15px;background:white;padding:15px;border-radius:50px;box-shadow:0 2px 10px rgba(0,0,0,.1)}.timer-control label{font-weight:600;color:#1e3c72;font-size:16px}.timer-control select{padding:10px 25px;border:2px solid #2a5298;border-radius:30px;font-size:16px;font-weight:700;background:white;cursor:pointer;outline:none;color:#1e3c72}.timer-control select:hover{background:#f0f4ff}.spin-btn{padding:18px 60px;font-size:28px;font-weight:700;background:#ffc107;color:#333;border:none;border-radius:50px;cursor:pointer;margin:20px 0;box-shadow:0 8px 0 #d39e00;transition:all 0.1s}.spin-btn:active{transform:translateY(5px);box-shadow:0 3px 0 #d39e00}.spin-btn:disabled{opacity:.5;transform:translateY(5px);box-shadow:0 3px 0 #d39e00;cursor:not-allowed}.result-message{font-size:1.8em;padding:20px;border-radius:15px;background:white;text-align:center;width:100%;font-weight:600;min-height:100px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 15px rgba(0,0,0,.1);border:2px solid transparent}.result-message.win{background:linear-gradient(135deg,#a8e6cf 0%,#d4edda 100%);color:#155724;border-color:#28a745}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;justify-content:center;background:white;padding:15px;border-radius:15px;width:100%}.legend-item{display:flex;align-items:center;gap:8px;padding:5px 15px;background:#f8faff;border-radius:25px;font-size:14px;font-weight:500}.legend-color{width:20px;height:20px;border-radius:6px}
    </style>
</head>
<body>
 <div class="container"><h1>Крутите барабан</h1><p class="subtitle">Для юковки</p><div class="main-panel"><div class="left-panel"><div class="add-section"><h2>Добавить</h2><div class="input-group"><input type="text" id="itemName" placeholder="Название" autocomplete="off"><input type="number" id="itemWeight" placeholder="Сумма" min="1" value="100"></div><button id="addBtn">Добавить</button></div><div class="items-list"><h3>Участники</h3><div id="itemsList"></div></div><div class="total-info"><div class="total-stats"><span>Общий вес: <span id="totalWeight">0</span></span><span>Элементов: <span id="totalItems">0</span></span></div><button id="clearBtn" class="clear-btn">Новая сессия</button></div></div><div class="right-panel"><h2>Рулетка</h2><div class="timer-control"><label>Время вращения:</label><select id="spinTime"><option value="3">3 секунды</option><option value="5">5 секунд</option><option value="10" selected>10 секунд</option><option value="15">15 секунд</option><option value="20">20 секунд</option><option value="30">30 секунд</option><option value="60">60 секунд</option></select></div><div class="wheel-container"><div class="pointer">▼</div><canvas id="wheelCanvas" width="450" height="450"></canvas><div class="wheel-center"></div></div><button id="spinBtn" class="spin-btn" disabled>Крутить</button><div id="result" class="result-message">Добавьте участников</div><div id="legend" class="legend"></div></div></div></div>

    <script>
       class ProbabilityWheel{constructor(){this.items=[];this.storageKey='wheelDataTimer';this.canvas=document.getElementById('wheelCanvas');this.ctx=this.canvas.getContext('2d');this.resultDiv=document.getElementById('result');this.totalWeightSpan=document.getElementById('totalWeight');this.totalItemsSpan=document.getElementById('totalItems');this.itemsListDiv=document.getElementById('itemsList');this.legendDiv=document.getElementById('legend');this.spinBtn=document.getElementById('spinBtn');this.spinTimeSelect=document.getElementById('spinTime');this.isSpinning=!1;this.currentRotation=0;this.colorPalette=['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFE194','#D4A5A5','#9B59B6','#F39C12','#1abc9c','#3498db','#9b59b6','#34495e','#f1c40f','#e67e22','#e74c3c','#95a5a6','#2ecc71','#16a085','#27ae60','#2980b9','#8e44ad','#2c3e50','#d35400','#c0392b'];this.loadFromStorage();this.drawWheel();this.renderList();this.updateTotalInfo()}
addOrUpdateItem(name,weight){if(!name.trim()){alert('Введите название!');return!1}
if(weight<=0||isNaN(weight)){alert('Сумма должна быть положительным числом!');return!1}
const normalizedName=name.trim().toLowerCase();const existingItem=this.items.find(item=>item.name.toLowerCase()===normalizedName);if(existingItem){existingItem.weight+=Number(weight);this.showMessage(`${existingItem.name} +${weight}`,'#4ecdc4')}else{const newColor=this.getUniqueColor();const newItem={id:Date.now()+Math.random(),name:name.trim(),weight:Number(weight),color:newColor};this.items.push(newItem);this.showMessage(`Добавлен: ${name}`,'#45b7d1')}
this.saveToStorage();this.renderList();this.drawWheel();this.updateTotalInfo();return!0}
getUniqueColor(){const usedColors=this.items.map(item=>item.color);for(let color of this.colorPalette){if(!usedColors.includes(color)){return color}}
return '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')}
removeItem(id){this.items=this.items.filter(item=>item.id!==id);this.saveToStorage();this.renderList();this.drawWheel();this.updateTotalInfo();this.showMessage('Элемент удален','#ff6b6b')}
clearAll(){this.items=[];this.saveToStorage();this.renderList();this.drawWheel();this.updateTotalInfo();this.resultDiv.textContent='Сессия очищена';this.resultDiv.className='result-message';this.spinBtn.disabled=!0}
showMessage(text,bgColor){this.resultDiv.textContent=text;this.resultDiv.style.background=bgColor;this.resultDiv.style.color='white';setTimeout(()=>{this.resultDiv.style.background='';this.resultDiv.style.color='';this.updateResultMessage()},1500)}
getTotalWeight(){return this.items.reduce((sum,item)=>sum+item.weight,0)}
updateTotalInfo(){this.totalWeightSpan.textContent=this.getTotalWeight();this.totalItemsSpan.textContent=this.items.length;this.spinBtn.disabled=this.items.length===0||this.isSpinning}
getRandomItem(){if(this.items.length===0)return null;const totalWeight=this.getTotalWeight();let random=Math.random()*totalWeight;for(let item of this.items){if(random<item.weight){return item}
random-=item.weight}
return this.items[this.items.length-1]}
drawWheel(){if(this.items.length===0){this.ctx.clearRect(0,0,450,450);this.ctx.fillStyle='#ccc';this.ctx.beginPath();this.ctx.arc(225,225,200,0,Math.PI*2);this.ctx.fill();this.ctx.fillStyle='#999';this.ctx.font='bold 20px Arial';this.ctx.fillText('?',215,235);return}
const totalWeight=this.getTotalWeight();let startAngle=0;const sortedItems=[...this.items].sort((a,b)=>a.id-b.id);this.ctx.clearRect(0,0,450,450);sortedItems.forEach(item=>{const sliceAngle=(item.weight/totalWeight)*Math.PI*2;const endAngle=startAngle+sliceAngle;this.ctx.beginPath();this.ctx.moveTo(225,225);this.ctx.arc(225,225,200,startAngle,endAngle);this.ctx.closePath();this.ctx.fillStyle=item.color;this.ctx.fill();this.ctx.strokeStyle='white';this.ctx.lineWidth=2;this.ctx.stroke();this.ctx.save();this.ctx.translate(225,225);this.ctx.rotate(startAngle+sliceAngle/2);this.ctx.textAlign='center';this.ctx.fillStyle='white';this.ctx.font='bold 14px Arial';this.ctx.shadowColor='black';this.ctx.shadowBlur=4;let displayName=item.name;if(displayName.length>10){displayName=displayName.substring(0,8)+'...'}
this.ctx.fillText(displayName,140,10);this.ctx.restore();startAngle=endAngle});this.ctx.beginPath();this.ctx.arc(225,225,200,0,Math.PI*2);this.ctx.strokeStyle='#333';this.ctx.lineWidth=4;this.ctx.stroke()}
spin(){if(this.items.length===0||this.isSpinning)return;const spinSeconds=parseInt(this.spinTimeSelect.value);const spinDuration=spinSeconds*1000;const winner=this.getRandomItem();const totalWeight=this.getTotalWeight();const sortedItems=[...this.items].sort((a,b)=>a.id-b.id);let startAngle=0;let winnerMidAngle=0;for(let item of sortedItems){const itemAngle=(item.weight/totalWeight)*Math.PI*2;if(item.id===winner.id){winnerMidAngle=startAngle+itemAngle/2;break}
startAngle+=itemAngle}
const winnerAngleDeg=(winnerMidAngle*180/Math.PI+90)%360;let targetRotation=-winnerAngleDeg;const baseSpins=Math.floor(spinSeconds/2);const spins=baseSpins+Math.floor(Math.random()*5);+5;const finalRotation=spins*360+targetRotation;this.isSpinning=!0;this.spinBtn.disabled=!0;this.resultDiv.className='result-message';const startTime=performance.now();const startRotation=this.currentRotation;this.canvas.style.transition=`transform ${spinDuration}ms cubic-bezier(0.2, 0.8, 0.3, 1)`;this.canvas.style.transform=`rotate(${finalRotation}deg)`;setTimeout(()=>{this.currentRotation=finalRotation;this.resultDiv.innerHTML=`<strong>${winner.name}</strong> (${winner.weight}р)`;this.resultDiv.className='result-message win';this.isSpinning=!1;this.spinBtn.disabled=!1;this.updateTotalInfo();setTimeout(()=>{this.canvas.style.transition='none'},50)},spinDuration)}
updateResultMessage(){if(this.items.length>0){this.resultDiv.textContent='Нажми "Крутить" для начала';this.resultDiv.className='result-message'}else{this.resultDiv.textContent='Добавьте участников';this.resultDiv.className='result-message'}}
saveToStorage(){localStorage.setItem(this.storageKey,JSON.stringify(this.items))}
loadFromStorage(){const data=localStorage.getItem(this.storageKey);if(data){this.items=JSON.parse(data)}else{this.items=[{id:1,name:'Шрек',weight:1000,color:'#FF6B6B'},{id:2,name:'Гонки',weight:10,color:'#4ECDC4'},{id:3,name:'Мадагаскар',weight:300,color:'#45B7D1'},{id:4,name:'Хуйня',weight:500,color:'#96CEB4'}]}}
renderList(){if(this.items.length===0){this.itemsListDiv.innerHTML='<div style="text-align:center;color:#999;padding:20px;">Список пуст</div>';return}
const totalWeight=this.getTotalWeight();this.itemsListDiv.innerHTML='';this.items.forEach(item=>{const percentage=((item.weight/totalWeight)*100).toFixed(1);const div=document.createElement('div');div.className='list-item';div.innerHTML=`
                        <div class="item-color" style="background: ${item.color};"></div>
                        <span class="item-name">${item.name}</span>
                        <span class="item-weight">${item.weight}р</span>
                        <span class="item-percent">${percentage}%</span>
                        <button class="remove-btn" data-id="${item.id}">✕</button>
                    `;this.itemsListDiv.appendChild(div)});document.querySelectorAll('.remove-btn').forEach(btn=>{btn.addEventListener('click',(e)=>{e.stopPropagation();const id=Number(e.target.dataset.id);this.removeItem(id)})});this.updateLegend()}
updateLegend(){const totalWeight=this.getTotalWeight();this.legendDiv.innerHTML='';this.items.forEach(item=>{const percentage=((item.weight/totalWeight)*100).toFixed(1);const legendItem=document.createElement('div');legendItem.className='legend-item';legendItem.innerHTML=`
                        <div class="legend-color" style="background: ${item.color};"></div>
                        <span>${item.name} (${percentage}%)</span>
                    `;this.legendDiv.appendChild(legendItem)})}}
document.addEventListener('DOMContentLoaded',()=>{const wheel=new ProbabilityWheel();document.getElementById('addBtn').addEventListener('click',()=>{const name=document.getElementById('itemName').value;const weight=document.getElementById('itemWeight').value;wheel.addOrUpdateItem(name,weight);document.getElementById('itemName').value='';document.getElementById('itemWeight').value='100'});document.getElementById('itemName').addEventListener('keypress',(e)=>{if(e.key==='Enter'){document.getElementById('addBtn').click()}});document.getElementById('spinBtn').addEventListener('click',()=>{wheel.spin()});document.getElementById('clearBtn').addEventListener('click',()=>{wheel.clearAll()})})
    </script>
</body>
</html>
